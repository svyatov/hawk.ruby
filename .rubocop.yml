AllCops:
  NewCops: enable
  TargetRubyVersion: 3.3
  SuggestExtensions: false
  CacheRootDirectory: .superpowers/rubocop-cache
  Exclude:
    - vendor/**/*
    - .superpowers/**/*

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/SpecialGlobalVars:
  EnforcedStyle: use_perl_names

Layout/LeadingCommentSpace:
  AllowRBSInlineAnnotation: true

Metrics/MethodLength:
  Max: 15
  CountAsOne: [array, hash, heredoc]

Metrics/ClassLength:
  Max: 150

Metrics/ParameterLists:
  CountKeywordArgs: false

Metrics/AbcSize:
  Exclude:
    - test/**/*

# These public methods follow the approved set_context/set_user API.
Naming/AccessorMethodName:
  Exclude:
    - lib/hawk.rb
    - lib/hawk/client.rb
    - lib/hawk/scope.rb

Naming/PredicateMethod:
  AllowedMethods: [call, flush, close, enqueue, accept, consume_escape]

# Bundler loads this entry point using the gem's published name.
Naming/FileName:
  Exclude:
    - lib/hawk-ruby.rb
